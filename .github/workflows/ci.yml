name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # forge init checks that git has a name and an email.
      - name: Set a git identity for the tests
        run: |
          git config --global user.name "Forge CI"
          git config --global user.email "ci@example.invalid"
      - name: Test
        run: node test/run.js
