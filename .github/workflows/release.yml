name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set a git identity for the tests
        run: |
          git config --global user.name "Forge CI"
          git config --global user.email "ci@example.invalid"
      - name: Test
        run: node test/run.js

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches VERSION in bin/forge
        run: |
          version="${GITHUB_REF_NAME#v}"
          printed="$(node bin/forge --version)"
          if [ "$printed" != "Forge $version" ]; then
            echo "the tag $GITHUB_REF_NAME does not match bin/forge, which prints: $printed" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Take the release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Forge $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
