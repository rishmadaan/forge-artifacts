<svg xmlns="http://www.w3.org/2000/svg" width="960" height="482" viewBox="0 0 960 482" role="img" aria-label="A terminal, on a store with a host set: forge publish report.html prints published report v1 (private) and a private link; forge share report prints the private link and a public link; forge publish --live updates the shared page to v2.">
<title>A terminal, on a store with a host set: forge publish report.html prints published report v1 (private) and a private link; forge share report prints the private link and a public link; forge publish --live updates the shared page to v2.</title>
<rect x="0.5" y="0.5" width="959" height="481" rx="14" fill="#0f131b" stroke="#2f3646"/>
<circle cx="28" cy="26" r="6" fill="#ff5f57"/><circle cx="48" cy="26" r="6" fill="#febc2e"/><circle cx="68" cy="26" r="6" fill="#28c840"/>
<text x="480" y="31" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#7f8aa3" text-anchor="middle">a terminal, or your agent</text>
<text x="28" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#7f8aa3"># a store with a host set (forge host)</text>
<text x="28" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#8ea4ff">$ </text><text x="46" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#e6e8ee">forge publish report.html</text>
<text x="28" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#5fd39a">published report v1 (private)</text>
<text x="28" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#e6e8ee">private: file:///home/you/.forge/private/d/k3Jq9xW2aB7c/index.html</text>
<text x="28" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#7f8aa3">share it with: forge share report</text>
<text x="28" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#e6e8ee"></text>
<text x="28" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#8ea4ff">$ </text><text x="46" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#e6e8ee">forge share report</text>
<text x="28" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#7f8aa3"># forge uploads to your host, then reads the site back</text>
<text x="28" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#5fd39a">shared report (latest v1)</text>
<text x="28" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#e6e8ee">private: file:///home/you/.forge/public/d/k3Jq9xW2aB7c/index.html</text>
<text x="28" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#e6e8ee">public: https://pages.example.org/d/k3Jq9xW2aB7c/</text>
<text x="28" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#e6e8ee"></text>
<text x="28" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#8ea4ff">$ </text><text x="46" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#e6e8ee">forge publish report.html --live</text>
<text x="28" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#5fd39a">published report v2 (shared)</text>
<text x="28" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#e6e8ee">private: file:///home/you/.forge/public/d/k3Jq9xW2aB7c/index.html</text>
<text x="28" y="438" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#e6e8ee">public: https://pages.example.org/d/k3Jq9xW2aB7c/</text>
</svg>
